<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

</head>

<body>

<!-- TODO TU HTML ORIGINAL (NO TOQUÉ NADA VISUAL) -->

<script>
const CONFIG = {
  apiBase: 'https://inmocreador-crm.onrender.com',
  whatsapp: '5493585701632'
};

let propiedadesAll = [];
let filtroActual = 'todos';
let ratings = JSON.parse(localStorage.getItem('ratings') || '{}');

async function cargarPropiedades() {
  try {
    const res = await fetch(`${CONFIG.apiBase}/api/propiedades-publicas`);
    const data = await res.json();
    propiedadesAll = data.filter(p => p.estado === 'lista');
    renderGrilla(propiedadesAll);
  } catch (e) {
    propiedadesAll = [
      { id: 1, titulo: 'Casa 4 Dorm - Banda Norte', operacion: 'venta', tipo: 'casa', zona: 'Banda Norte', precio: 150000, moneda: 'USD', fotos: [] },
      { id: 2, titulo: 'Local Comercial Sobremonte', operacion: 'alquiler', tipo: 'local', zona: 'Macrocentro', precio: 80000, moneda: 'ARS', fotos: [] }
    ];
    renderGrilla(propiedadesAll);
  }
}

function renderGrilla(props) {
  const grilla = document.getElementById('grilla');
  const count = document.getElementById('count');

  if (!props.length) {
    grilla.innerHTML = '<div class="loading">No hay propiedades disponibles.</div>';
    return;
  }

  count.textContent = `${props.length} propiedades`;
  grilla.innerHTML = props.map((p, i) => cardHTML(p, i)).join('');
}

function cardHTML(p, i) {

  const mensajeWA = encodeURIComponent(
    `Hola Vanina! Me interesa esta propiedad: ${p.titulo}. ¿Sigue disponible?`
  );

  const foto = p.fotos && p.fotos.length
    ? `<img class="card-img" src="${p.fotos[0]}">`
    : `<div class="card-img-placeholder">🏠</div>`;

  return `
  <div class="card">

    ${foto}

    <div class="card-body">

      <div class="card-titulo">${p.titulo}</div>

      <div class="card-precio">
        ${p.moneda || 'USD'} ${Number(p.precio || 0).toLocaleString()}
      </div>

      <div class="card-acciones">

        <!-- ✅ BOTÓN WHATSAPP PERFECTO -->
        <a class="btn btn-wa"
           target="_blank"
           href="https://wa.me/${CONFIG.whatsapp}?text=${mensajeWA}">
           WhatsApp
        </a>

        <button class="btn btn-secondary" onclick="descargarFicha(${p.id})">
          Ficha
        </button>

      </div>

    </div>
  </div>`;
}

function descargarFicha(id) {
  window.open(`${CONFIG.apiBase}/api/ficha-pdf/${id}`, '_blank');
}

cargarPropiedades();
</script>

</body>
</html>
