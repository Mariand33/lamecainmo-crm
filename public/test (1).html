<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
<style>
.card{border:2px solid #ccc;border-radius:12px;margin:16px;overflow:visible}
.ficha{display:none;background:#c8e6c9;padding:16px;border-top:2px solid green}
.ficha.open{display:block}
</style>
</head>
<body>

<article class="card">
  <div style="padding:16px"><b>Propiedad 1</b></div>
  <div style="padding:0 16px 12px">
    <button onclick="toggle(this)">Ver ficha 1</button>
  </div>
  <div class="ficha">FICHA 1 abierta ✓</div>
</article>

<article class="card">
  <div style="padding:16px"><b>Propiedad 2</b></div>
  <div style="padding:0 16px 12px">
    <button onclick="toggle(this)">Ver ficha 2</button>
  </div>
  <div class="ficha">FICHA 2 abierta ✓</div>
</article>

<article class="card">
  <div style="padding:16px"><b>Propiedad 3</b></div>
  <div style="padding:0 16px 12px">
    <button onclick="toggle(this)">Ver ficha 3</button>
  </div>
  <div class="ficha">FICHA 3 abierta ✓</div>
</article>

<script>
function toggle(btn){
  var article = btn.closest("article");
  var ficha = article.querySelector(".ficha");
  var abierta = ficha.classList.contains("open");
  document.querySelectorAll(".ficha").forEach(function(f){f.classList.remove("open")});
  if(!abierta) ficha.classList.add("open");
}
</script>
</body>
</html>
