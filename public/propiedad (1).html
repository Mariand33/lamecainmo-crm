<style>
:root{
  --bg:#0b1a12;--card:#0f2318;--dark:#0a140d;
  --border:#1e3a28;--muted:#7a9a82;
  --wa:#25D366;--gold:#c9a84c;--gold2:#e8cc7a;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  --surface:rgba(255,255,255,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:#e8f0ea;min-height:100vh}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
.container{width:min(900px,92%);margin:0 auto}

/* NAV */
.nav{
  background:rgba(10,20,13,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(201,168,76,.12);
  padding:14px 0;
  position:sticky;top:0;z-index:100;
}
.nav-inner{
  display:flex;align-items:center;justify-content:space-between;
  width:min(900px,92%);margin:0 auto;
}
.nav-brand{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-size:20px;color:#fff;
}
.nav-brand span{
  display:block;font-family:'DM Sans',sans-serif;
  font-style:normal;font-size:9px;letter-spacing:2.5px;
  text-transform:uppercase;color:rgba(255,255,255,.4);margin-top:1px;
}
.nav-back{
  display:flex;align-items:center;gap:7px;
  font-size:13px;color:var(--muted);
  background:var(--surface);border:1px solid var(--border);
  padding:7px 14px;border-radius:30px;
  transition:.2s;cursor:pointer;
}
.nav-back:hover{color:#fff;border-color:rgba(255,255,255,.2)}

/* SKELETON */
.skeleton{
  background:linear-gradient(90deg,var(--card) 25%,rgba(255,255,255,.04) 50%,var(--card) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s ease infinite;
  border-radius:8px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* HERO FOTO */
.foto-hero{
  position:relative;
  background:var(--card);
  border-radius:0;
  overflow:hidden;
  max-height:520px;
}
.foto-hero img{
  width:100%;height:520px;
  object-fit:cover;display:block;
  transition:opacity .4s;
}
.foto-hero-skel{height:520px}
.foto-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.7) 100%);
  pointer-events:none;
}
.foto-badge{
  position:absolute;top:16px;left:16px;
  background:rgba(10,20,13,.85);
  border:1px solid rgba(201,168,76,.3);
  color:var(--gold2);font-size:11px;letter-spacing:1.5px;
  text-transform:uppercase;font-weight:600;
  padding:5px 13px;border-radius:30px;
  backdrop-filter:blur(6px);
}
.foto-nuevo{
  position:absolute;top:16px;right:16px;
  background:var(--wa);color:#fff;
  font-size:10px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;padding:5px 12px;border-radius:30px;
}
/* Thumbnails */
.thumbs{
  display:flex;gap:8px;padding:12px 16px;
  background:var(--dark);overflow-x:auto;
  scrollbar-width:none;
}
.thumbs::-webkit-scrollbar{display:none}
.thumb{
  width:72px;height:54px;flex-shrink:0;
  border-radius:8px;overflow:hidden;cursor:pointer;
  border:2px solid transparent;transition:.2s;opacity:.6;
}
.thumb.active{border-color:var(--gold);opacity:1}
.thumb:hover{opacity:.85}
.thumb img{width:100%;height:100%;object-fit:cover}

/* CONTENIDO */
.content{padding:28px 0 60px}

/* Info header */
.prop-header{margin-bottom:24px}
.prop-tipo{
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:var(--gold);font-weight:600;margin-bottom:8px;
}
.prop-titulo{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(26px,5vw,42px);font-weight:600;
  color:#fff;line-height:1.1;margin-bottom:12px;
}
.prop-zona{
  display:flex;align-items:center;gap:6px;
  font-size:14px;color:var(--muted);margin-bottom:16px;
}
.prop-precio{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(28px,5vw,44px);font-weight:600;
  color:var(--gold2);
}
.prop-operacion{
  font-size:12px;color:var(--muted);margin-top:3px;
}

/* Pills de features */
.features{
  display:flex;flex-wrap:wrap;gap:10px;
  margin:20px 0;
}
.feat-pill{
  display:flex;align-items:center;gap:7px;
  background:var(--surface);border:1px solid var(--border);
  padding:8px 14px;border-radius:30px;
  font-size:13px;color:#e8f0ea;
}
.feat-pill span{font-size:16px}

/* Descripción */
.desc-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:24px;margin:24px 0;
}
.desc-box h3{
  font-family:'Cormorant Garamond',serif;
  font-size:18px;font-weight:600;color:var(--gold2);
  margin-bottom:12px;
}
.desc-text{
  font-size:14px;line-height:1.8;color:rgba(232,240,234,.75);
  white-space:pre-wrap;
}

/* Divider */
.divider{
  height:1px;
  background:linear-gradient(90deg,transparent,var(--border),transparent);
  margin:28px 0;
}

/* ACCIONES */
.acciones{
  display:flex;flex-direction:column;gap:12px;
  position:sticky;bottom:0;z-index:50;
  background:linear-gradient(to top,var(--bg) 80%,transparent);
  padding:16px 0 20px;margin-top:8px;
}
.btn-wa{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--wa);color:#fff;
  border:none;border-radius:14px;padding:16px;
  font-size:16px;font-weight:700;font-family:'DM Sans',sans-serif;
  cursor:pointer;width:100%;transition:.2s;
  box-shadow:0 8px 28px rgba(37,211,102,.3);
}
.btn-wa:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(37,211,102,.4)}
.btn-wa svg{flex-shrink:0}

.btn-compartir{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:transparent;color:var(--gold2);
  border:1px solid rgba(201,168,76,.3);border-radius:14px;padding:13px;
  font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;
  cursor:pointer;width:100%;transition:.2s;
}
.btn-compartir:hover{background:rgba(201,168,76,.07);border-color:rgba(201,168,76,.5)}

.btns-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn-volver{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);color:var(--muted);
  border:1px solid var(--border);border-radius:14px;padding:13px;
  font-size:13px;font-family:'DM Sans',sans-serif;
  cursor:pointer;width:100%;transition:.2s;
}
.btn-volver:hover{color:#fff;border-color:rgba(255,255,255,.2)}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#0f2318;border:1px solid rgba(201,168,76,.3);
  color:var(--gold2);font-size:13px;font-weight:500;
  padding:12px 22px;border-radius:30px;
  opacity:0;transition:.3s;pointer-events:none;z-index:999;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Branding footer */
.prop-footer{
  text-align:center;padding:32px 0 16px;
  border-top:1px solid var(--border);
}
.prop-footer .brand-name{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-size:22px;color:#fff;
}
.prop-footer .brand-sub{
  font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--muted);margin-top:4px;
}

/* Error */
.error-box{
  text-align:center;padding:80px 20px;
}
.error-box h2{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;color:var(--gold2);margin-bottom:12px;
}
.error-box p{color:var(--muted);font-size:14px}

@media(max-width:600px){
  .foto-hero img{height:300px}
  .foto-hero-skel{height:300px}
  .prop-titulo{font-size:26px}
  .prop-precio{font-size:28px}
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand">
      Vanina Buzzacchi
      <span>Negocios Inmobiliarios · Río Cuarto</span>

</nav>

<!-- FOTO HERO -->
<div class="foto-hero" id="fotoHero">
  <div class="foto-hero-skel skeleton" id="fotoSkel"></div>
  <img id="fotoMain" style="display:none" alt="Foto propiedad"/>
  <div class="foto-overlay"></div>

<div class="container content" id="mainContent" style="display:none">

  <!-- ACCIONES STICKY -->
  <div class="acciones">
    <button class="btn-wa" id="btnWa" onclick="consultarWa()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>

  <div class="prop-footer">

</div>

<!-- ERROR -->
<div class="container error-box" id="errorBox" style="display:none">
  <h2>Propiedad no encontrada</h2>
  <p>Es posible que haya sido dada de baja o el link esté incompleto.</p>
  <br>
  <button class="btn-volver" style="max-width:280px;margin:0 auto" onclick="volverCatalogo()">
    ← Ver catálogo completo
  </button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const API_URL   = '/api/inmuebles-publicos';
const WA_NUMBER = '5493584322626';
const IMG_BASE  = '';

let propData = null;
let imagenes  = [];

// ── Leer ?id= de la URL ──────────────────────────────
const params  = new URLSearchParams(location.search);
const propId  = params.get('id');

// ── Helpers ──────────────────────────────────────────
function formatPrice(item) {
  const p = Number(item.precio || 0);
  if (!p) return 'Consultar';
  return `${item.moneda || 'USD'} ${p.toLocaleString('es-AR')}`;
}

function getImage(item, idx = 0) {
  if (item.imagenes && item.imagenes.length > idx) {
    const img = item.imagenes[idx];
    if (!img) return fallbackImg(item);
    if (img.startsWith('http://') || img.startsWith('https://')) return img;
    return IMG_BASE + img;
  }
  return fallbackImg(item);
}

function fallbackImg(item) {
  const tipo = (item.tipoPropiedad || item.tipo || '').toLowerCase();
  const seed  = Math.abs(String(item.id || '').split('').reduce((a,c) => a + c.charCodeAt(0), 0)) % 9;
  const casas = ['photo-1568605114967-8130f3a36994','photo-1570129477492-45c003edd2be','photo-1576941089067-2de3c901e126','photo-1449844908441-8829872d2607','photo-1523217582562-09d0def993a6','photo-1600596542815-ffad4c1539a9','photo-1600585154340-be6161a56a0c','photo-1512917774080-9991f1c4c750','photo-1558618666-fcd25c85cd64'];
  const deptos = ['photo-1502672260266-1c1ef2d93688','photo-1536376072261-38c75010e6c9','photo-1560448204-e02f11c3d0e2','photo-1522708323590-d24dbb6b0267','photo-1493809842364-78817add7ffb'];
  const terrenos = ['photo-1500382017468-9049fed747ef','photo-1416331108676-a22ccb276e35','photo-1464822759023-fed622ff2c3b'];
  let pool = casas;
  if (tipo.includes('depto') || tipo.includes('departamento')) pool = deptos;
  else if (tipo.includes('terreno') || tipo.includes('lote')) pool = terrenos;
  return `https://images.unsplash.com/${pool[seed % pool.length]}?w=900&q=80`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function volverCatalogo() {
  window.location.href = '/';
}

// ── Render de la propiedad ─────────────────────────
function renderProp(item) {
  propData = item;
  imagenes = (item.imagenes && item.imagenes.length > 0)
    ? item.imagenes.filter(Boolean)
    : [null];

  // Foto principal
  const fotoMain = document.getElementById('fotoMain');
  const fotoSkel = document.getElementById('fotoSkel');
  fotoMain.src = getImage(item, 0);
  fotoMain.onload = () => {
    fotoSkel.style.display = 'none';
    fotoMain.style.display = 'block';
  };
  fotoMain.onerror = () => {
    fotoMain.src = `https://placehold.co/900x520/0f2318/c9a84c?text=Propiedad`;
    fotoSkel.style.display = 'none';
    fotoMain.style.display = 'block';
  };

  // Badge tipo
  const badge = document.getElementById('fotoBadge');
  if (item.tipoPropiedad || item.tipo) {
    badge.textContent = item.tipoPropiedad || item.tipo;
    badge.style.display = 'block';
  }

  // Nuevo ingreso
  if (item.fecha) {
    const diff = Date.now() - new Date(item.fecha).getTime();
    if (diff < 1000 * 60 * 60 * 24 * 14) {
      document.getElementById('fotoNuevo').style.display = 'block';
    }
  }

  // Thumbnails si hay varias fotos
  if (imagenes.length > 1) {
    const wrap = document.getElementById('thumbsWrap');
    wrap.style.display = 'flex';
    imagenes.forEach((img, i) => {
      const div = document.createElement('div');
      div.className = 'thumb' + (i === 0 ? ' active' : '');
      const im = document.createElement('img');
      const src = img
        ? (img.startsWith('http') ? img : IMG_BASE + img)
        : getImage(item, i);
      im.src  = src;
      im.alt  = `Foto ${i+1}`;
      div.appendChild(im);
      div.onclick = () => {
        fotoMain.src = src;
        document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
        div.classList.add('active');
      };
      wrap.appendChild(div);
    });
  }

  // Textos
  document.getElementById('propTipo').textContent =
    (item.tipoOperacion ? item.tipoOperacion.toUpperCase() + ' · ' : '') +
    (item.tipoPropiedad || item.tipo || '');

  document.getElementById('propTitulo').textContent = item.titulo || 'Propiedad disponible';

  const zona = item.zona || '';
  const dir  = item.direccion || '';
  document.getElementById('propZona').innerHTML =
    `<span style="font-size:15px">📍</span> ${zona}${dir ? ' · ' + dir : ''}`;

  document.getElementById('propPrecio').textContent = formatPrice(item);
  document.getElementById('propOperacion').textContent =
    item.tipoOperacion ? `En ${item.tipoOperacion.toLowerCase()}` : '';

  // Features pills
  const features = [];
  if (item.dormitorios) features.push({ icon: '🛏', label: `${item.dormitorios} dormitorios` });
  if (item.banos)       features.push({ icon: '🚿', label: `${item.banos} baños` });
  if (item.superficie)  features.push({ icon: '📐', label: `${item.superficie} m²` });
  if (item.cochera)     features.push({ icon: '🚗', label: 'Cochera' });
  if (item.piscina)     features.push({ icon: '🏊', label: 'Piscina' });
  if (item.jardin)      features.push({ icon: '🌿', label: 'Jardín' });
  if (item.quincho)     features.push({ icon: '🔥', label: 'Quincho' });

  const featWrap = document.getElementById('features');
  features.forEach(f => {
    const pill = document.createElement('div');
    pill.className = 'feat-pill';
    pill.innerHTML = `<span>${f.icon}</span>${f.label}`;
    featWrap.appendChild(pill);
  });

  // Descripción
  if (item.descripcion && item.descripcion.trim()) {
    document.getElementById('descText').textContent = item.descripcion.trim();
    document.getElementById('descBox').style.display = 'block';
  }

  // Actualizar meta OG (para cuando se re-comparte)
  const pageUrl = location.href;
  const imgUrl  = getImage(item, 0);
  const desc    = `${formatPrice(item)} · ${zona} · Vanina Buzzacchi Negocios Inmobiliarios`;

  document.getElementById('page-title').textContent   = `${item.titulo || 'Propiedad'} | Vanina Buzzacchi`;
  document.getElementById('og-title').setAttribute('content', item.titulo || 'Propiedad');
  document.getElementById('og-description').setAttribute('content', desc);
  document.getElementById('og-image').setAttribute('content', imgUrl);
  document.getElementById('og-url').setAttribute('content', pageUrl);
  document.getElementById('tw-title').setAttribute('content', item.titulo || 'Propiedad');
  document.getElementById('tw-desc').setAttribute('content', desc);
  document.getElementById('tw-image').setAttribute('content', imgUrl);

  // Mostrar contenido
  document.getElementById('mainContent').style.display = 'block';
}

// ── Botones de acción ──────────────────────────────
function consultarWa() {
  if (!propData) return;
  const titulo = propData.titulo || 'Propiedad';
  const precio = formatPrice(propData);
  const zona   = propData.zona || '';
  const url    = location.href;
  const msg    = `Hola Vanina, vi esta propiedad y quiero más información:\n\n🏠 *${titulo}*\n📍 ${zona}\n💰 ${precio}\n\n${url}`;
  window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
}

function compartirWa() {
  if (!propData) return;
  const titulo = propData.titulo || 'Propiedad';
  const precio = formatPrice(propData);
  const zona   = propData.zona || '';
  const tipo   = propData.tipoPropiedad || propData.tipo || '';
  const dorm   = propData.dormitorios ? `${propData.dormitorios} dorm.` : '';
  const banos  = propData.banos ? `${propData.banos} baños` : '';
  const sup    = propData.superficie ? `${propData.superficie} m²` : '';
  const extras = [tipo, dorm, banos, sup].filter(Boolean).join(' · ');
  const url    = location.href;

  const msg = [
    `🏠 *${titulo}*`,
    zona ? `📍 ${zona}` : '',
    `💰 *${precio}*`,
    extras ? `✨ ${extras}` : '',
    ``,
    `🔗 ${url}`,
    ``,
    `─────────────────────`,
    `📋 *Vanina Buzzacchi | Negocios Inmobiliarios*`,
    `📍 Río Cuarto · Córdoba`,
    `📞 Más propiedades: ${location.origin}`,
  ].filter(l => l !== undefined).join('\n');

  // Intentar Web Share API primero (móvil)
  if (navigator.share) {
    navigator.share({
      title: titulo,
      text: `${titulo} · ${precio} · ${zona}`,
      url: url,
    }).catch(() => {
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    });
  } else {
    // Copiar al portapapeles + abrir WhatsApp
    navigator.clipboard?.writeText(url).then(() => {
      showToast('✓ Link copiado al portapapeles');
    }).catch(() => {});
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
  }
}

// ── Cargar propiedad ───────────────────────────────
async function init() {
  if (!propId) {
    document.getElementById('errorBox').style.display = 'block';
    return;
  }

  try {
    const res  = await fetch(API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('API error');
    const data = await res.json();
    const list = Array.isArray(data) ? data : (data.inmuebles || data.properties || []);
    const item = list.find(p => String(p.id) === String(propId));

    if (!item) {
      document.getElementById('fotoSkel').style.display = 'none';
      document.getElementById('errorBox').style.display = 'block';
      return;
    }

    renderProp(item);

  } catch (err) {
    console.error(err);
    document.getElementById('fotoSkel').style.display = 'none';
    document.getElementById('errorBox').style.display = 'block';
  }
}

init();
</script>
