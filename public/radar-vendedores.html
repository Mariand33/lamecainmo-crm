<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radar Vendedores</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#c9a84c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VB Inmuebles" />
  <link rel="apple-touch-icon" href="/icon-192x192.png" />
  <style>
    :root{
      --verde1:#0e6b4d;
      --verde2:#094634;
      --bg:#f4f6f9;
      --txt:#1f2937;
      --muted:#6b7280;
      --azul:#0984e3;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--txt);display:flex;min-height:100vh;}
    .sidebar{width:260px;background:linear-gradient(180deg, var(--verde1), var(--verde2));color:#fff;padding:18px 16px;overflow:auto;}
    .sidebar nav a{display:block;color:#fff;text-decoration:none;padding:10px;margin:7px 0;border-radius:10px;font-size:14px;}
    .sidebar nav a.active,.sidebar nav a:hover{background:rgba(255,255,255,0.18);}
    .content{flex:1;padding:24px;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 10px rgba(0,0,0,.05);}
    label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;}
    input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:12px;margin-bottom:12px;}
    textarea{min-height:110px;resize:vertical;}
    .row{display:flex;gap:10px;flex-wrap:wrap;}
    .btn{border:none;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;text-decoration:none;}
    .btn-primary{background:var(--verde1);}
    .btn-blue{background:var(--azul);}
    .btn-ghost{background:#6b7280;}
    .estado{margin-top:8px;color:var(--muted);font-size:13px;min-height:18px;}
    .list{display:grid;gap:12px;}
    .item{border:1px solid #e5e7eb;border-radius:12px;padding:12px;background:#fafafa;}
    .kv{display:grid;grid-template-columns:140px 1fr;gap:8px;font-size:13px;margin:6px 0;}
    .k{color:var(--muted);font-weight:700;}
    .texto{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px;white-space:pre-wrap;font-size:13px;line-height:1.45;margin-top:10px;}
    @media(max-width:900px){
      body{flex-direction:column;}
      .sidebar{width:100%;}
      .grid{grid-template-columns:1fr;}
      .kv{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <nav>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/radar-leads.html">🎯 Radar Leads</a>
      <a href="/radar-vendedores.html" class="active">📡 Radar Vendedores</a>
      <a href="/compradores.html">Compradores</a>
      <a href="/oportunidad.html">Nueva Oportunidad</a>
      <a href="/logout">Cerrar sesión</a>
    </nav>
  </aside>

  <main class="content">
    <h1>📡 Radar Vendedores</h1>
    <p style="color:#6b7280;">Guardá contactos o señales de propietarios que podrían vender.</p>

    <div class="grid">
      <section class="card">
        <h3>Nuevo vendedor detectado</h3>

        <label>Nombre / referencia</label>
        <input id="nombre" type="text" placeholder="Ej: Laura / vecina / dueño directo" />

        <label>WhatsApp</label>
        <input id="telefono" type="text" placeholder="Ej: 358..." />

        <label>Dirección aproximada</label>
        <input id="direccion" type="text" placeholder="Ej: Calle 2 N° 84" />

        <label>Zona</label>
        <input id="zona" type="text" placeholder="Ej: Banda Norte / Alberdi" />

        <label>Tipo de propiedad</label>
        <select id="tipoPropiedad">
          <option value="">No definido</option>
          <option value="casa">Casa</option>
          <option value="depto">Depto</option>
          <option value="terreno">Terreno</option>
          <option value="local">Local</option>
          <option value="quinta">Quinta</option>
        </select>

        <label>Precio estimado</label>
        <input id="precio" type="number" placeholder="Ej: 90000" />

        <label>Moneda</label>
        <select id="moneda">
          <option value="USD">USD</option>
          <option value="ARS">ARS</option>
        </select>

        <label>Origen</label>
        <select id="origen">
          <option value="facebook">Facebook</option>
          <option value="marketplace">Marketplace</option>
          <option value="instagram">Instagram</option>
          <option value="calle">Calle</option>
          <option value="referido">Referido</option>
          <option value="otro">Otro</option>
        </select>

        <label>Nivel</label>
        <select id="nivel">
          <option value="posible">Posible</option>
          <option value="caliente">Caliente</option>
          <option value="evaluando">Evaluando</option>
          <option value="curioso">Curioso</option>
        </select>

        <label>Notas</label>
        <textarea id="notas" placeholder="Qué dijo, si parece dueño, si está evaluando vender, etc."></textarea>

        <div class="row">
          <button class="btn btn-primary" id="btnGuardar">Guardar vendedor</button>
          <button class="btn btn-ghost" id="btnLimpiar">Limpiar</button>
        </div>

        <div class="estado" id="estado"></div>
      </section>

      <section class="card">
        <h3>Vendedores detectados</h3>
        <div id="lista" class="list"></div>
      </section>
    </div>
  </main>

  <script>
    const nombre = document.getElementById("nombre");
    const telefono = document.getElementById("telefono");
    const direccion = document.getElementById("direccion");
    const zona = document.getElementById("zona");
    const tipoPropiedad = document.getElementById("tipoPropiedad");
    const precio = document.getElementById("precio");
    const moneda = document.getElementById("moneda");
    const origen = document.getElementById("origen");
    const nivel = document.getElementById("nivel");
    const notas = document.getElementById("notas");

    const btnGuardar = document.getElementById("btnGuardar");
    const btnLimpiar = document.getElementById("btnLimpiar");
    const estado = document.getElementById("estado");
    const lista = document.getElementById("lista");

    function limpiarFormulario(){
      nombre.value = "";
      telefono.value = "";
      direccion.value = "";
      zona.value = "";
      tipoPropiedad.value = "";
      precio.value = "";
      moneda.value = "USD";
      origen.value = "facebook";
      nivel.value = "posible";
      notas.value = "";
      delete btnGuardar.dataset.editIndex;
    }

    function money(mon, val){
      const n = Number(val || 0);
      if (!n) return "No definido";
      return `${(mon || "USD").toUpperCase()} ${n.toLocaleString("es-AR")}`;
    }

    function renderItems(items){
      window._vendedoresCache = items;

      if (!items.length){
        lista.innerHTML = `<div style="color:#6b7280;">Todavía no hay vendedores cargados.</div>`;
        return;
      }

      lista.innerHTML = items.map((v, index) => `
        <article class="item">
          <div class="kv"><div class="k">Nombre</div><div>${v.nombre || "-"}</div></div>
          <div class="kv"><div class="k">WhatsApp</div><div>${v.telefono || "-"}</div></div>
          <div class="kv"><div class="k">Dirección</div><div>${v.direccion || "-"}</div></div>
          <div class="kv"><div class="k">Zona</div><div>${v.zona || "-"}</div></div>
          <div class="kv"><div class="k">Tipo</div><div>${v.tipoPropiedad || "-"}</div></div>
          <div class="kv"><div class="k">Precio</div><div>${money(v.moneda, v.precio)}</div></div>
          <div class="kv"><div class="k">Origen</div><div>${v.origen || "-"}</div></div>
          <div class="kv"><div class="k">Nivel</div><div>${v.nivel || "-"}</div></div>
          <div class="texto">${v.notas || "Sin notas"}</div>
          <div class="row" style="margin-top:10px;">
            <button class="btn btn-blue" onclick='editarVendedor(${index})'>Editar</button>
          </div>
        </article>
      `).join("");
    }

    async function cargarVendedores(){
      try {
        const r = await fetch("/api/radar-vendedores");
        const data = await r.json();
        renderItems(Array.isArray(data) ? data : []);
      } catch (e) {
        console.error(e);
        lista.innerHTML = `<div style="color:#6b7280;">No se pudieron cargar los vendedores.</div>`;
      }
    }

    async function guardarVendedor(){
      const body = {
        nombre: (nombre.value || "").trim(),
        telefono: (telefono.value || "").trim(),
        direccion: (direccion.value || "").trim(),
        zona: (zona.value || "").trim(),
        tipoPropiedad: (tipoPropiedad.value || "").trim(),
        precio: Number(precio.value || 0),
        moneda: (moneda.value || "USD").trim(),
        origen: (origen.value || "facebook").trim(),
        nivel: (nivel.value || "posible").trim(),
        notas: (notas.value || "").trim()
      };

      if (!body.nombre && !body.telefono && !body.direccion) {
        estado.textContent = "Cargá al menos nombre, teléfono o dirección.";
        return;
      }

      estado.textContent = "Guardando vendedor...";

      const editIndex = btnGuardar.dataset.editIndex;
      const url = editIndex !== undefined && editIndex !== ""
        ? "/api/radar-vendedores/editar/" + editIndex
        : "/api/radar-vendedores/guardar";

      try {
        const r = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        const data = await r.json();

        if (!r.ok || !data.ok) {
          estado.textContent = "No se pudo guardar el vendedor.";
          return;
        }

        estado.textContent = "Vendedor guardado correctamente ✅";
        limpiarFormulario();
        cargarVendedores();

      } catch (e) {
        console.error(e);
        estado.textContent = "Error al guardar vendedor.";
      }
    }

    window.editarVendedor = function(index){
      const v = window._vendedoresCache && window._vendedoresCache[index];
      if (!v) {
        estado.textContent = "No se pudo abrir para editar.";
        return;
      }

      nombre.value = v.nombre || "";
      telefono.value = v.telefono || "";
      direccion.value = v.direccion || "";
      zona.value = v.zona || "";
      tipoPropiedad.value = v.tipoPropiedad || "";
      precio.value = v.precio || "";
      moneda.value = v.moneda || "USD";
      origen.value = v.origen || "facebook";
      nivel.value = v.nivel || "posible";
      notas.value = v.notas || "";

      btnGuardar.dataset.editIndex = index;
      estado.textContent = "Editando vendedor #" + index;
    };

    btnGuardar.addEventListener("click", guardarVendedor);
    btnLimpiar.addEventListener("click", () => {
      limpiarFormulario();
      estado.textContent = "";
    });

    cargarVendedores();
  </script>
  <!-- Service Worker PWA -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
