<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propiedad - Vanina Buzzacchi</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00e5ff">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#020d12;--card:#041018;--cyan:#00e5ff;--border:rgba(0,229,255,.15);}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:#d0f0f8;min-height:100vh;}
.topbar{background:linear-gradient(135deg,#010c14,#021525);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);}
.marca{font-family:'Playfair Display',serif;font-size:24px;color:#00e5ff;text-shadow:0 0 20px rgba(0,229,255,.4);font-style:italic;}
.volver{color:rgba(0,229,255,.7);text-decoration:none;font-size:13px;letter-spacing:.08em;border:1px solid rgba(0,229,255,.2);padding:7px 14px;border-radius:6px;transition:all .2s;}
.volver:hover{background:rgba(0,229,255,.1);color:#00e5ff;}
.detalle{max-width:1140px;margin:0 auto;padding:32px 20px 80px;}
.wrap{display:grid;grid-template-columns:1.3fr .7fr;gap:28px;align-items:start;}
@media(max-width:880px){.wrap{grid-template-columns:1fr;}}
/* CARRUSEL */
.carousel-main{position:relative;border-radius:16px;overflow:hidden;background:#041018;aspect-ratio:16/10;cursor:zoom-in;}
.cm-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease;}
.cm-img.active{opacity:1;}
.cm-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:5;background:rgba(0,0,0,.5);color:#fff;border:none;width:40px;height:60px;font-size:26px;cursor:pointer;border-radius:6px;transition:background .2s;display:flex;align-items:center;justify-content:center;}
.cm-btn:hover{background:rgba(0,229,255,.4);}
.cm-prev{left:10px;}.cm-next{right:10px;}
.cm-counter{position:absolute;bottom:12px;right:14px;z-index:5;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:4px 10px;border-radius:20px;}
.cm-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:6px;}
.cm-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;transition:all .2s;border:none;}
.cm-dot.on{background:#00e5ff;box-shadow:0 0 8px rgba(0,229,255,.7);transform:scale(1.2);}
/* GALERIA */
.gal-title{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(0,229,255,.5);margin:20px 0 10px;}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;}
.gal-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .2s;}
.gal-grid img:hover{border-color:rgba(0,229,255,.5);transform:scale(1.04);}
.gal-grid img.on{border-color:#00e5ff;box-shadow:0 0 12px rgba(0,229,255,.4);}
/* INFO */
.bloque{background:rgba(4,16,24,.9);border:1px solid var(--border);border-radius:16px;padding:28px;}
h1{font-family:'Playfair Display',serif;font-size:clamp(24px,3vw,36px);font-weight:400;color:#f0f8ff;line-height:1.1;margin-bottom:10px;}
.precio{font-family:'Playfair Display',serif;font-size:30px;color:#00e5ff;text-shadow:0 0 16px rgba(0,229,255,.4);margin-bottom:6px;font-weight:600;}
.zona{color:rgba(200,230,240,.5);font-size:14px;margin-bottom:4px;}
.entre{color:rgba(0,229,255,.5);font-size:12px;margin-bottom:18px;letter-spacing:.05em;}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;}
.meta span{background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.15);border-radius:999px;padding:7px 14px;font-size:12px;color:rgba(200,240,255,.75);}
.desc{white-space:pre-line;line-height:1.75;color:rgba(200,225,235,.65);font-size:14px;margin-top:14px;}
.side-title{font-family:'Playfair Display',serif;font-size:22px;color:#f0f8ff;margin-bottom:8px;}
.side-sub{font-size:13px;color:rgba(200,225,235,.45);line-height:1.6;margin-bottom:18px;}
.btn-wa{display:flex;align-items:center;gap:10px;background:#25d366;color:#fff;padding:14px 20px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px;transition:all .2s;box-shadow:0 4px 20px rgba(37,211,102,.25);justify-content:center;}
.btn-wa:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(37,211,102,.35);}
.btn-sec{display:flex;align-items:center;gap:10px;background:rgba(0,229,255,.08);color:#00e5ff;border:1px solid rgba(0,229,255,.25);padding:12px 20px;border-radius:10px;text-decoration:none;font-size:13px;margin-top:10px;justify-content:center;cursor:pointer;transition:all .2s;}
.btn-sec:hover{background:rgba(0,229,255,.15);}
.divider{height:1px;background:var(--border);margin:18px 0;}
.tels{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.tel-a{display:flex;align-items:center;gap:10px;color:rgba(0,229,255,.7);font-size:13px;text-decoration:none;border:1px solid rgba(0,229,255,.12);padding:8px 14px;border-radius:8px;transition:all .2s;}
.tel-a:hover{background:rgba(0,229,255,.07);border-color:rgba(0,229,255,.3);}
/* LIGHTBOX */
.lb{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.96);align-items:center;justify-content:center;}
.lb.open{display:flex;}
.lb-img{max-width:94vw;max-height:88vh;object-fit:contain;border-radius:8px;}
.lb-x{position:absolute;top:16px;right:20px;color:#fff;font-size:30px;cursor:pointer;background:none;border:none;opacity:.7;}
.lb-x:hover{opacity:1;}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:42px;cursor:pointer;background:rgba(255,255,255,.07);border:none;width:52px;height:72px;border-radius:8px;transition:background .2s;}
.lb-nav:hover{background:rgba(0,229,255,.3);}
.lb-l{left:12px;}.lb-r{right:12px;}
.lb-ct{position:absolute;bottom:16px;color:rgba(255,255,255,.45);font-size:13px;}
.estado{text-align:center;padding:80px 20px;color:rgba(200,225,235,.4);font-size:16px;}
</style>
</head>
<body>
<div class="topbar">
  <div class="marca">Vanina Buzzacchi</div>
  <a class="volver" href="/funnel">← Propiedades</a>
</div>
<div class="detalle" id="detalle">
  <div class="estado" id="estado">Cargando propiedad...</div>
</div>
<div class="lb" id="lb">
  <button class="lb-x" onclick="closeLB()">&#10005;</button>
  <button class="lb-nav lb-l" onclick="lbMove(-1)">&#8249;</button>
  <img class="lb-img" id="lbImg" src="" alt="">
  <button class="lb-nav lb-r" onclick="lbMove(1)">&#8250;</button>
  <div class="lb-ct" id="lbCt"></div>
</div>
<script>
const RENDER = "https://inmocreador-crm.onrender.com";
const SB_URL = "https://nniivhebocgdsynlpuhf.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5uaWl2aGVib2NnZHN5bmxwdWhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMDQ4MDksImV4cCI6MjA5MTg4MDgwOX0.LucbLf6bWhNYdfo2zhmCgkf5gTKsvJWA73_piCmoG70";
const SB_H   = {apikey:SB_KEY,Authorization:"Bearer "+SB_KEY};
const WA     = "5493585701632";

let imgs=[], lbI=0, cmI=0, cmT=null;

function pid(){return new URLSearchParams(location.search).get("id");}
function fmt(p){const n=Number(p.precio||0);return n?(p.moneda||"USD")+" "+n.toLocaleString("es-AR"):"Consultar";}

function buildImgUrl(img){
  if(!img) return "";

  if(
    img.startsWith("http://") ||
    img.startsWith("https://") ||
    img.startsWith("/uploads/")
  ){
    return img;
  }

  return RENDER + "/uploads/" + img;
}

function buildImgs(p){
  const out=[];

  (p.imagenes || []).forEach(i=>{
    const url = buildImgUrl(i);
    if(url && !out.includes(url)) out.push(url);
  });

  (p.mediaUrls || p.media_urls || []).forEach(u=>{
    if(u && !out.includes(u)) out.push(u);
  });

  return out.length
    ? out
    : ["https://placehold.co/1200x700/041018/00e5ff?text=Sin+fotos"];
}

/* CARRUSEL */
function cmGo(idx){
  const els=document.querySelectorAll('.cm-img'), ds=document.querySelectorAll('.cm-dot'), gs=document.querySelectorAll('.gal-grid img');
  if(!els.length)return;
  els[cmI].classList.remove('active'); ds[cmI]&&ds[cmI].classList.remove('on'); gs[cmI]&&gs[cmI].classList.remove('on');
  cmI=(idx+els.length)%els.length;
  els[cmI].classList.add('active'); ds[cmI]&&ds[cmI].classList.add('on'); gs[cmI]&&gs[cmI].classList.add('on');
  const ct=document.getElementById('cmCt'); if(ct)ct.textContent=(cmI+1)+" / "+els.length;
}
function cmStart(){if(cmT)clearInterval(cmT); if(imgs.length>1)cmT=setInterval(()=>cmGo(cmI+1),3800);}

/* LIGHTBOX */
function openLB(i){lbI=i;document.getElementById('lbImg').src=imgs[i];document.getElementById('lbCt').textContent=(i+1)+" / "+imgs.length;document.getElementById('lb').classList.add('open');document.body.style.overflow='hidden';}
function closeLB(){document.getElementById('lb').classList.remove('open');document.body.style.overflow='';}
function lbMove(d){lbI=(lbI+d+imgs.length)%imgs.length;document.getElementById('lbImg').src=imgs[lbI];document.getElementById('lbCt').textContent=(lbI+1)+" / "+imgs.length;}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLB();if(e.key==='ArrowRight')lbMove(1);if(e.key==='ArrowLeft')lbMove(-1);});

/* RENDER */
function render(p){
  imgs=buildImgs(p);
  const wa=encodeURIComponent("Hola Vanina, me interesa: "+(p.titulo||"")+" | "+fmt(p));
  const carImgs=imgs.map((s,i)=>`<img class="cm-img${i===0?' active':''}" src="${s}" alt="foto ${i+1}" onclick="openLB(${i})" onerror="this.src='https://placehold.co/1200x700/041018/00e5ff?text=Sin+foto'">`).join('');
  const dots=imgs.length>1?imgs.map((_,i)=>`<button class="cm-dot${i===0?' on':''}" onclick="cmGo(${i});cmStart()"></button>`).join(''):'';
  const galImgs=imgs.length>1?imgs.map((s,i)=>`<img src="${s}" alt="f${i}" class="${i===0?'on':''}" onclick="cmGo(${i});cmStart();" onerror="this.src='https://placehold.co/400x300/041018/00e5ff?text=X'">`).join(''):'';

  document.getElementById('detalle').innerHTML=`
    <div class="wrap">
      <div>
        <div class="carousel-main" id="carMain">
          ${carImgs}
          ${imgs.length>1?`<button class="cm-btn cm-prev" onclick="cmGo(cmI-1);cmStart()">&#8249;</button><button class="cm-btn cm-next" onclick="cmGo(cmI+1);cmStart()">&#8250;</button><div class="cm-dots">${dots}</div><div class="cm-counter" id="cmCt">1 / ${imgs.length}</div>`:'<div id="cmCt"></div>'}
        </div>
        ${imgs.length>1?`<div class="gal-title">Todas las fotos (${imgs.length})</div><div class="gal-grid">${galImgs}</div>`:''}
        <div class="bloque" style="margin-top:22px">
          <h1>${p.titulo||"Propiedad"}</h1>
          <div class="precio">${fmt(p)}</div>
          <div class="zona">&#128205; ${p.zona||"-"}${p.direccion?" &middot; "+p.direccion:""}</div>
          ${(p.entre_calles||p.entreCalles)?`<div class="entre">Entre: ${p.entre_calles||p.entreCalles}</div>`:''}
          <div class="meta">
            ${p.tipoOperacion?`<span>${p.tipoOperacion.toUpperCase()}</span>`:''}
            ${(p.tipoInmueble||p.tipoPropiedad)?`<span>${p.tipoInmueble||p.tipoPropiedad}</span>`:''}
            ${p.dormitorios?`<span>${p.dormitorios} dorm.</span>`:''}
            ${p.banos?`<span>${p.banos} ba&ntilde;os</span>`:''}
            ${p.superficie?`<span>${p.superficie} m&sup2;</span>`:''}
            ${p.superficieCub?`<span>${p.superficieCub} m&sup2; cub.</span>`:''}
          </div>
          ${p.descripcion?`<div class="desc">${p.descripcion}</div>`:''}
        </div>
      </div>
      <div>
        <div class="bloque">
          <div class="side-title">Consult&aacute; esta propiedad</div>
          <div class="side-sub">Coordin&aacute; una visita o ped&iacute; m&aacute;s informaci&oacute;n con Vanina.</div>
          <a class="btn-wa" href="https://wa.me/${WA}?text=${wa}" target="_blank">
            &#128172; Consultar por WhatsApp
          </a>
          <a class="btn-sec" href="/funnel">&#8592; Ver m&aacute;s propiedades</a>
          <a class="btn-sec" href="${RENDER}/api/ficha-pdf/${p.id}" target="_blank">&#128196; Descargar ficha PDF</a>
          <div class="divider"></div>
          <div style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(0,229,255,.4);margin-bottom:10px">Contacto directo</div>
          <div class="tels">
            <a class="tel-a" href="https://wa.me/5493585701632" target="_blank">&#128242; 358 570-1632</a>
            <a class="tel-a" href="https://wa.me/5493584322626" target="_blank">&#128242; 358 432-2626</a>
            <a class="tel-a" href="https://wa.me/5493585189849" target="_blank">&#128242; 358 518-9849</a>
          </div>
        </div>
      </div>
    </div>`;

  cmI=0; cmStart();
  const car=document.getElementById('carMain');
  if(car){let tx=0;car.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});car.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40){cmGo(cmI+(d<0?1:-1));cmStart();}},{passive:true});}
}

async function cargar(){
  const id=pid();
  if(!id){document.getElementById('estado').textContent='ID no encontrado.';return;}
  // Render directo
  try{
    const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch(RENDER+"/api/inmuebles-publicos/"+id,{cache:"no-store",signal:ctrl.signal});
    if(r.ok){const p=await r.json();if(p&&p.id){render(p);return;}}
  }catch(e){console.warn("Render falló, Supabase directo");}
  // Supabase directo
  try{
    const r=await fetch(SB_URL+"/rest/v1/inmuebles?id=eq."+id+"&select=*",{headers:SB_H});
    if(r.ok){const d=await r.json();if(d&&d[0]){const x=d[0];render({id:x.id,titulo:x.titulo,descripcion:x.descripcion,precio:x.precio,moneda:x.moneda,tipoOperacion:x.tipo_operacion,tipoInmueble:x.tipo_inmueble,zona:x.zona,direccion:x.direccion,entre_calles:x.entre_calles,dormitorios:x.dormitorios,banos:x.banos,superficie:x.superficie,superficieCub:x.superficie_cub,imagenes:x.imagenes||[],mediaUrls:x.media_urls||[]});return;}}
  }catch(e){console.error("Supabase falló:",e.message);}
  document.getElementById('estado').textContent='No se pudo cargar la propiedad.';
}
cargar();
</script>
<script>if("serviceWorker"in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{})}</script>
</body>
</html>
