<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle de Propiedad – Vanina Buzzacchi</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Outfit', sans-serif;
  background: #F5F0E8;
  margin: 0;
}

.detalle {
  max-width: 900px;
  margin: auto;
  padding: 30px;
}

.estado {
  text-align: center;
  padding: 60px;
  color: #666;
}

h1 {
  font-family: 'Playfair Display', serif;
  margin-bottom: 10px;
}

.precio {
  color: #B8934A;
  font-size: 26px;
  font-weight: bold;
  margin-bottom: 20px;
}

.galeria {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 20px;
}

.galeria img {
  width: 100%;
  border-radius: 10px;
  object-fit: cover;
}

.info {
  display: grid;
  gap: 8px;
  margin-bottom: 20px;
}

.btn-wa {
  display: inline-block;
  margin-top: 20px;
  background: #25D366;
  color: white;
  padding: 14px 22px;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="detalle" id="detalle">
  <div class="estado" id="estado">Cargando propiedad...</div>
</div>

<script>

// 🔹 Obtener ID desde URL
function getParam(k) {
  return new URLSearchParams(window.location.search).get(k);
}

// 🔹 API CRM
const API_URL = "https://inmocreador-crm.onrender.com/api/inmuebles-publicos";

// 🔹 Cargar propiedad REAL desde CRM
async function cargar() {
  const id = getParam("id");

  if (!id) {
    document.getElementById("estado").textContent = "ID no encontrado.";
    return;
  }

  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    const prop = data.find(p => String(p._id) === String(id));

    if (!prop) {
      document.getElementById("estado").textContent = "Propiedad no encontrada.";
      return;
    }

    renderPropiedad(prop);

  } catch (error) {
    document.getElementById("estado").textContent = "Error cargando propiedad.";
  }
}

// 🔹 Render de la ficha
function renderPropiedad(p) {
  const precio = Number(p.precio || 0).toLocaleString('es-AR');

  const imagenes = Array.isArray(p.imagenes) && p.imagenes.length > 0
    ? p.imagenes.map(img => 
        `<img src="https://inmocreador-crm.onrender.com/uploads/${img}">`
      ).join("")
    : `<img src="https://via.placeholder.com/900x600?text=Propiedad">`;

  const html = `
    <h1>${p.titulo || "Propiedad"}</h1>
    <div class="precio">${p.moneda || "USD"} ${precio}</div>

    <div class="galeria">
      ${imagenes}
    </div>

    <div class="info">
      <p>📍 ${p.zona || "-"}</p>
      <p>📐 ${p.metros || "-"} m²</p>
      <p>🛏 ${p.dormitorios || "-"} dormitorios</p>
      <p>🚿 ${p.banos || "-"} baños</p>
      <p>🚗 ${p.garage ? "Con garage" : "Sin garage"}</p>
    </div>

    <p>${p.descripcion || "Sin descripción."}</p>

    <a class="btn-wa"
       href="https://wa.me/5493585701632?text=${encodeURIComponent(`Hola Vanina! Me interesa esta propiedad: ${p.titulo}`)}"
       target="_blank">
      Contactar por WhatsApp
    </a>
  `;

  document.getElementById("detalle").innerHTML = html;
}

// 🚀 Ejecutar
cargar();

</script>

</body>
</html>

</script>

</body>
</html>
