<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle de Propiedad – Vanina Buzzacchi</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Outfit', sans-serif;
  background: #F5F0E8;
  margin: 0;
}

.detalle {
  max-width: 800px;
  margin: auto;
  padding: 30px;
}

.estado {
  text-align: center;
  padding: 60px;
  color: #666;
}

h1 {
  font-family: 'Playfair Display', serif;
}

.precio {
  color: #B8934A;
  font-size: 24px;
  font-weight: bold;
}

.btn-wa {
  display: inline-block;
  margin-top: 20px;
  background: #25D366;
  color: white;
  padding: 12px 20px;
  text-decoration: none;
  border-radius: 6px;
}
</style>
</head>

<body>

<div class="detalle" id="detalle">
  <div class="estado" id="estado">Cargando propiedad...</div>
</div>

<script>

// Obtener ID desde URL
function getParam(k) {
  return new URLSearchParams(window.location.search).get(k);
}

// 🔥 BASE DE DATOS LOCAL (sin backend)
const propiedades = [
  {
    _id: "1",
    titulo: "Casa en Banda Norte",
    precio: 80000,
    descripcion: "Patio amplio 🌿, galería con asador y entrada de vehículos.",
    metros: 120,
    dormitorios: 2,
    banos: 1,
    garage: true,
    ubicacion: "Río Cuarto"
  },
  {
    _id: "2",
    titulo: "Departamento céntrico",
    precio: 55000,
    descripcion: "Excelente ubicación, ideal inversión.",
    metros: 60,
    dormitorios: 1,
    banos: 1,
    garage: false,
    ubicacion: "Centro"
  }
];

function cargar() {
  const id = getParam("id");

  const prop = propiedades.find(p => String(p._id) === String(id));

  if (!prop) {
    document.getElementById("estado").textContent = "Propiedad no encontrada.";
    return;
  }

  renderPropiedad(prop);
}

function renderPropiedad(p) {
  const precio = Number(p.precio).toLocaleString('es-AR');

  const html = `
    <h1>${p.titulo}</h1>
    <div class="precio">USD ${precio}</div>

    <p>${p.descripcion}</p>

    <p>📐 ${p.metros} m²</p>
    <p>🛏 ${p.dormitorios} dormitorios</p>
    <p>🚿 ${p.banos} baños</p>
    <p>🚗 ${p.garage ? "Con garage" : "Sin garage"}</p>
    <p>📍 ${p.ubicacion}</p>

    <a class="btn-wa" href="https://wa.me/5493585701632" target="_blank">
      Contactar por WhatsApp
    </a>
  `;

  document.getElementById("detalle").innerHTML = html;
}

cargar();

</script>

</body>
</html>
