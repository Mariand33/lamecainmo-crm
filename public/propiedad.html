<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle de Propiedad – Vanina Buzzacchi</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Outfit', sans-serif;
  background: #F5F0E8;
  margin: 0;
  color: #1f1b17;
}

.topbar {
  background: linear-gradient(135deg,#0f2e24,#1a4a38);
  color: white;
  padding: 18px 20px;
}

.topbar .marca {
  max-width: 1100px;
  margin: auto;
  font-family: 'Playfair Display', serif;
  font-size: 30px;
  color: #D9B15D;
}

.detalle {
  max-width: 1100px;
  margin: auto;
  padding: 30px 20px 60px;
}

.estado {
  text-align: center;
  padding: 60px;
  color: #666;
  font-size: 18px;
}

.volver {
  display: inline-block;
  margin-bottom: 20px;
  color: #143d2f;
  font-weight: 600;
  text-decoration: none;
}

.wrap {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 26px;
  align-items: start;
}

.bloque {
  background: white;
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 10px 30px rgba(0,0,0,.08);
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 42px;
  margin: 0 0 12px;
  line-height: 1.05;
}

.precio {
  color: #B8934A;
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 10px;
}

.zona {
  color: #6b645c;
  font-size: 17px;
  margin-bottom: 20px;
}

.hero-img {
  width: 100%;
  height: 440px;
  object-fit: cover;
  border-radius: 16px;
  background: #e7dfd2;
}

.galeria {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 14px 0 0;
}

.galeria img {
  width: 100%;
  height: 115px;
  object-fit: cover;
  border-radius: 10px;
  cursor: pointer;
  background: #e7dfd2;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 18px 0;
}

.meta span {
  background: #f8f4ec;
  border: 1px solid #ebe1d0;
  border-radius: 999px;
  padding: 9px 13px;
  font-size: 14px;
  color: #5d554c;
}

.desc {
  white-space: pre-line;
  line-height: 1.65;
  color: #4d473f;
  font-size: 16px;
}

.side h3 {
  margin-top: 0;
  font-family: 'Playfair Display', serif;
  font-size: 28px;
}

.side p {
  color: #5f584f;
  line-height: 1.6;
}

.btn-wa {
  display: inline-block;
  margin-top: 20px;
  background: #25D366;
  color: white;
  padding: 15px 22px;
  text-decoration: none;
  border-radius: 12px;
  font-weight: bold;
}

.btn-pdf {
  display: inline-block;
  margin-top: 12px;
  background: #111;
  color: white;
  padding: 15px 22px;
  text-decoration: none;
  border-radius: 12px;
  font-weight: bold;
}

@media (max-width: 900px) {
  .wrap {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 32px;
  }

  .hero-img {
    height: 280px;
  }

  .galeria {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="marca">Vanina Buzzacchi</div>
</div>

<div class="detalle" id="detalle">
  <a class="volver" href="funnel-publico.html">← Volver a propiedades</a>
  <div class="estado" id="estado">Cargando propiedad...</div>
</div>

<script>
const API_URL = "https://inmocreador-crm.onrender.com/api/inmuebles-publicos";
const API_DETALLE = "https://inmocreador-crm.onrender.com/api/inmuebles-publicos/";
const PDF_URL = "https://inmocreador-crm.onrender.com/api/ficha-pdf/";
const BASE_FILES = "https://inmocreador-crm.onrender.com";
const WHATSAPP_NUMBER = "5493585701632";

function getID() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id");
}

function formatPrice(p) {
  const precio = Number(p.precio || 0);
  if (!precio) return "Consultar";
  return `${p.moneda || "USD"} ${precio.toLocaleString("es-AR")}`;
}

function getMainImage(p) {
  if (Array.isArray(p.imagenes) && p.imagenes.length > 0) {
    return `${BASE_FILES}/uploads/${p.imagenes[0]}`;
  }
  return "https://via.placeholder.com/1200x700?text=Propiedad";
}

function getGalleryImages(p) {
  if (Array.isArray(p.imagenes) && p.imagenes.length > 0) {
    return p.imagenes.map(img => `${BASE_FILES}/uploads/${img}`);
  }
  return [];
}

function encontrarPropiedad(data, id) {
  return data.find(p => {
    const posiblesIDs = [p._id, p.id, p._id?.$oid];
    return posiblesIDs.some(pid => pid && String(pid).trim() === String(id).trim());
  });
}

async function cargar() {
  const id = getID();

  if (!id) {
    document.getElementById("estado").textContent = "ID no encontrado.";
    return;
  }

  try {
    const resDirecta = await fetch(API_DETALLE + id, { cache: "no-store" });

    if (resDirecta.ok) {
      const prop = await resDirecta.json();
      render(prop, id);
      return;
    }

    const res = await fetch(API_URL, { cache: "no-store" });
    const data = await res.json();
    const prop = encontrarPropiedad(data, id);

    if (!prop) {
      document.getElementById("estado").textContent = "Propiedad no encontrada.";
      return;
    }

    render(prop, id);

  } catch (error) {
    console.error(error);
    document.getElementById("estado").textContent = "Error cargando propiedad.";
  }
}

function render(p, id) {
  const gallery = getGalleryImages(p);
  const principal = getMainImage(p);

  const html = `
    <a class="volver" href="funnel-publico.html">← Volver a propiedades</a>

    <div class="wrap">
      <div class="bloque">
        <img id="heroImage" class="hero-img" src="${principal}" alt="${p.titulo || "Propiedad"}">

        ${gallery.length ? `
          <div class="galeria">
            ${gallery.map(src => `
              <img src="${src}" alt="Foto propiedad"
                   onclick="document.getElementById('heroImage').src='${src}'">
            `).join("")}
          </div>
        ` : ""}

        <div style="margin-top:24px">
          <h1>${p.titulo || "Propiedad"}</h1>
          <div class="precio">${formatPrice(p)}</div>
          <div class="zona">${p.zona || "-"}${p.direccion ? " · " + p.direccion : ""}</div>

          <div class="meta">
            <span>${p.tipoOperacion || "Operación"}</span>
            <span>${p.tipoPropiedad || "Propiedad"}</span>
            <span>${p.dormitorios ? p.dormitorios + " dorm." : "Dormitorios a consultar"}</span>
            <span>${p.banos ? p.banos + " baños" : "Baños a consultar"}</span>
          </div>

          <div class="desc">${p.descripcion || "Sin descripción."}</div>
        </div>
      </div>

      <div class="bloque side">
        <h3>Consultá esta propiedad</h3>
        <p>Recibí más información, coordiná una visita o pedí asesoramiento personalizado.</p>

        <a class="btn-wa"
           href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent("Hola Vanina, me interesa esta propiedad: " + (p.titulo || "") + " | Zona: " + (p.zona || "-") + " | Precio: " + formatPrice(p))}"
           target="_blank">
           Consultar por WhatsApp
        </a>

        <br>

        <a class="btn-pdf"
           href="${PDF_URL}${id}"
           target="_blank">
           Ver ficha PDF
        </a>
      </div>
    </div>
  `;

  document.getElementById("detalle").innerHTML = html;
}

cargar();
</script>

</body>
</html>
