<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle de Propiedad – Vanina Buzzacchi</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Outfit', sans-serif;
  background: #F5F0E8;
  margin: 0;
}

.detalle {
  max-width: 900px;
  margin: auto;
  padding: 30px;
}

.estado {
  text-align: center;
  padding: 60px;
  color: #666;
}

h1 {
  font-family: 'Playfair Display', serif;
}

.precio {
  color: #B8934A;
  font-size: 26px;
  font-weight: bold;
}

.galeria {
  display: grid;
  gap: 10px;
  margin: 20px 0;
}

.galeria img {
  width: 100%;
  border-radius: 10px;
}

.btn-wa {
  display: inline-block;
  margin-top: 20px;
  background: #25D366;
  color: white;
  padding: 14px 22px;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="detalle" id="detalle">
  <div class="estado" id="estado">Cargando propiedad...</div>
</div>

<script>

const API_URL = "https://inmocreador-crm.onrender.com/api/inmuebles-publicos";

// 🔹 Obtener ID desde URL
function getID() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id");
}

// 🔥 FUNCIÓN ULTRA ROBUSTA (soporta TODOS los formatos)
function encontrarPropiedad(data, id) {

  return data.find(p => {

    const posiblesIDs = [
      p._id,
      p.id,
      p._id?.$oid
    ];

    return posiblesIDs.some(pid =>
      pid && String(pid).trim() === String(id).trim()
    );

  });

}

async function cargar() {

  const id = getID();

  if (!id) {
    document.getElementById("estado").textContent = "ID no encontrado.";
    return;
  }

  try {

    const res = await fetch(API_URL);
    const data = await res.json();

    // 🧠 DEBUG PRO (te deja ver TODO si algo falla)
    console.log("ID URL:", id);
    console.log("IDs disponibles:", data.map(p => ({
      _id: p._id,
      id: p.id
    })));

    const prop = encontrarPropiedad(data, id);

    if (!prop) {
      document.getElementById("estado").textContent = "Propiedad no encontrada.";
      return;
    }

    render(prop);

  } catch (error) {
    document.getElementById("estado").textContent = "Error cargando propiedad.";
  }

}

function render(p) {

  const precio = Number(p.precio || 0).toLocaleString("es-AR");

  const imagenes = Array.isArray(p.imagenes) && p.imagenes.length
    ? p.imagenes.map(img =>
        `<img src="https://inmocreador-crm.onrender.com/uploads/${img}">`
      ).join("")
    : `<img src="https://via.placeholder.com/900x600?text=Propiedad">`;

  const html = `
    <h1>${p.titulo || "Propiedad"}</h1>
    <div class="precio">${p.moneda || "USD"} ${precio}</div>

    <div class="galeria">
      ${imagenes}
    </div>

    <p><strong>📍 Zona:</strong> ${p.zona || "-"}</p>
    <p><strong>📐 Metros:</strong> ${p.metros || "-"}</p>
    <p><strong>🛏 Dormitorios:</strong> ${p.dormitorios || "-"}</p>
    <p><strong>🚿 Baños:</strong> ${p.banos || "-"}</p>
    <p><strong>🚗 Garage:</strong> ${p.garage ? "Sí" : "No"}</p>

    <p>${p.descripcion || "Sin descripción."}</p>

    <a class="btn-wa"
       href="https://wa.me/5493585701632?text=${encodeURIComponent("Hola Vanina! Me interesa esta propiedad: " + (p.titulo || ""))}"
       target="_blank">
       Consultar por WhatsApp
    </a>
  `;

  document.getElementById("detalle").innerHTML = html;
}

// 🚀 Ejecutar
cargar();

</script>

</body>
</html>
