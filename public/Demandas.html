<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demandas</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#c9a84c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VB Inmuebles" />
  <link rel="apple-touch-icon" href="/icon-192x192.png" />

<style>

body{
font-family:Arial;
background:#f5f7fa;
margin:0;
padding:20px;
color:#1f2937;
}

h1{
margin-bottom:10px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

label{
font-weight:bold;
font-size:13px;
}

input,select,textarea{
width:100%;
padding:8px;
border-radius:8px;
border:1px solid #ccc;
margin-top:4px;
margin-bottom:10px;
}

button{
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.btn{
background:#0e6b4d;
color:white;
}

.btn-blue{
background:#1f6feb;
color:white;
}

.btn-red{
background:#e74c3c;
color:white;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
font-size:13px;
}

th{
background:#f0f0f5;
}

.small{
font-size:12px;
color:#6b7280;
}

.match{
background:#f9fafb;
padding:10px;
border-radius:10px;
margin-top:10px;
}

</style>
</head>

<body>

<h1>Demandas</h1>

<div class="card">

<h3>Nueva Demanda</h3>

<form action="/demandas/nuevo" method="POST">

<label>Operación</label>
<select name="tipoOperacion">
<option value="venta">Venta</option>
<option value="alquiler">Alquiler</option>
</select>

<label>Tipo propiedad</label>
<input name="tipoPropiedad" placeholder="casa / depto / terreno">

<label>Zona</label>
<input name="zona">

<label>Presupuesto máximo</label>
<input name="presupuestoMax" type="number">

<label>Moneda</label>
<select name="moneda">
<option value="USD">USD</option>
<option value="ARS">ARS</option>
</select>

<label>Dormitorios mínimos</label>
<input name="dormitoriosMin" type="number">

<label>Contacto</label>
<input name="contacto">

<label>Notas</label>
<textarea name="notas"></textarea>

<button class="btn" type="submit">
Guardar Demanda
</button>

</form>

</div>


<div class="card">

<h3>Demandas cargadas</h3>

<div id="lista">
Cargando...
</div>

</div>


<div class="card">

<h3>Resultados de Match</h3>

<div id="matches">
Sin resultados
</div>

</div>


<script>

let DEMANDAS=[]

async function cargarDemandas(){

const r = await fetch("/api/demandas")
const data = await r.json()

DEMANDAS=data

render()

}

function render(){

const div=document.getElementById("lista")

if(!DEMANDAS.length){

div.innerHTML="No hay demandas cargadas"

return

}

let html=`<table>
<thead>
<tr>
<th>Operación</th>
<th>Zona</th>
<th>Tipo</th>
<th>Presupuesto</th>
<th>Contacto</th>
<th>Acciones</th>
</tr>
</thead>
<tbody>`

DEMANDAS.forEach((d,i)=>{

html+=`

<tr>

<td>${d.tipoOperacion||"-"}</td>

<td>${d.zona||"-"}</td>

<td>${d.tipoPropiedad||"-"}</td>

<td>${d.presupuestoMax||0} ${d.moneda||""}</td>

<td>
<b>${d.contacto||"-"}</b>
<div class="small">${d.notas||""}</div>
</td>

<td>

<button class="btn-blue" onclick="match(${i})">
Matchear
</button>

<form action="/demandas/eliminar/${i}" method="POST" style="display:inline;">
<button class="btn-red">
Eliminar
</button>
</form>

</td>

</tr>

`

})

html+=`</tbody></table>`

div.innerHTML=html

}


async function match(i){

const box=document.getElementById("matches")

box.innerHTML="Matcheando..."

const r = await fetch(`/api/match-demanda/${i}`)

const data = await r.json()

if(!data.matches.length){

box.innerHTML="No hubo matches"

return

}

let html=""

data.matches.forEach(m=>{

html+=`

<div class="match">

<b>${m.inmueble.titulo}</b>

<div>
Zona: ${m.inmueble.zona}
</div>

<div>
Precio: ${m.inmueble.precio} ${m.inmueble.moneda}
</div>

<div>
Score: ${m.score}
</div>

</div>

`

})

box.innerHTML=html

}

cargarDemandas()

</script>

  <!-- Service Worker PWA -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
