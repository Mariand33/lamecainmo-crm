<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanina Buzzacchi | Propiedades</title>

<style>
body{font-family:Arial;margin:0;background:#f5f1e8}
.container{width:90%;margin:auto}
.card{background:#fff;border-radius:12px;margin:20px 0;padding:15px;box-shadow:0 10px 20px rgba(0,0,0,.1)}
button{padding:10px;border:none;border-radius:8px;cursor:pointer}
.btn{background:black;color:white}
.ficha{display:none;margin-top:15px;padding:10px;border-top:2px solid #ddd}
.ficha.abierta{display:block}
</style>
</head>

<body>

<div class="container">
<h1>Propiedades disponibles</h1>

<div id="propertiesGrid"></div>

</div>

<script>
// CONFIG
var WA = "543585701632";
var IMG_BASE = "https://inmocreador-crm.onrender.com/uploads/";

// PROPIEDADES
var PROPS = [
{
titulo:"Casa Banda Norte",
precio:150000,
zona:"Banda Norte",
imgs:["1772213059707.png"]
},
{
titulo:"Casa Bimaco",
precio:160000,
zona:"Bimaco",
imgs:["1772573270295.jpg"]
},
{
titulo:"Casa Moderna",
precio:150000,
zona:"Universidad",
imgs:["1772578555340.jpg"]
},
{
titulo:"Inversión x3",
precio:120000,
zona:"Quintitas",
imgs:["1772640682196-912.jpg"]
}
];

// FUNCIONES
function precio(p){
return "USD "+p.precio.toLocaleString("es-AR");
}

function waLink(txt){
return `https://wa.me/${WA}?text=${encodeURIComponent(txt)}`;
}

// RENDER
function render(){
const grid = document.getElementById("propertiesGrid");

grid.innerHTML = PROPS.map((p,i)=>{

let img = p.imgs[0] ? IMG_BASE+p.imgs[0] : "";

return `
<div class="card">

<img src="${img}" style="width:100%;height:200px;object-fit:cover">

<h3>${p.titulo}</h3>
<p>${precio(p)}</p>
<p>${p.zona}</p>

'<a class="btn-card btn-view" href="https://inmocreador-crm.onrender.com/ver.html?index='+idx+'" target="_blank">Ver ficha</a>'+

<a href="${waLink(`Hola! Me interesa ${p.titulo}`)}" target="_blank">
<button style="background:#25D366;color:white">WhatsApp</button>
</a>

<div class="ficha" id="ficha-${i}">
<p>Información completa de ${p.titulo}</p>
</div>

</div>
`;

}).join("");
}

// ABRIR / CERRAR
function toggleFicha(i){
const f = document.getElementById("ficha-"+i);

if(!f) return;

document.querySelectorAll(".ficha").forEach(x=>x.classList.remove("abierta"));

if(!f.classList.contains("abierta")){
f.classList.add("abierta");
}
}

// INIT
render();

// 🔥 DEBUG QUE PEDISTE
setTimeout(()=>{
console.log("DEBUG FICHAS:");

console.log(document.getElementById("ficha-0"));
console.log(document.getElementById("ficha-1"));
console.log(document.getElementById("ficha-2"));
console.log(document.getElementById("ficha-3"));

},500);

</script>

</body>
</html>
