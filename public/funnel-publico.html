<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanina Buzzacchi – Propiedades</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body { font-family: 'Outfit', sans-serif; margin:0; background:#F5F0E8; color:#1A1A18; }

.banner-top {
  background:#B8934A;
  color:#1A1A18;
  text-align:center;
  padding:6px;
  font-size:12px;
  font-weight:600;
}

header {
  background:#1A1A18;
  color:white;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.hero {
  background:#1A1A18;
  color:white;
  padding:40px;
  text-align:center;
}

.grilla {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  padding:40px;
}

.card {
  background:white;
  border-radius:6px;
  overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,0.1);
}

.card-img {
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-body {
  padding:20px;
}

.card-titulo {
  font-weight:600;
  margin-bottom:6px;
}

.card-precio {
  font-size:20px;
  margin:8px 0;
}

.card-urgencia {
  font-size:12px;
  color:#B8934A;
}

.card-acciones {
  margin-top:10px;
  display:flex;
  gap:10px;
}

button, a {
  padding:10px;
  border:none;
  cursor:pointer;
  text-decoration:none;
}

button {
  background:#1A1A18;
  color:#fff;
}

a {
  background:#25D366;
  color:#fff;
}

.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content {
  background:white;
  padding:20px;
  width:300px;
}

</style>
</head>

<body>

<div class="banner-top">
🔥 NUEVAS PROPIEDADES TODAS LAS SEMANAS
</div>

<header>
  <div><strong>Vanina Buzzacchi</strong></div>
  <a href="https://wa.me/5493585701632" target="_blank">WhatsApp</a>
</header>

<section class="hero">
  <h1>Tu próxima propiedad te está esperando</h1>
</section>

<div class="grilla" id="grilla"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Dejanos tus datos</h3>
    <input id="nombre" placeholder="Nombre"><br><br>
    <input id="tel" placeholder="Teléfono"><br><br>
    <button onclick="enviarLead()">Enviar</button>
  </div>
</div>

<script>
const API = "https://inmocreador-crm.onrender.com";
let propiedadActual = "";

async function cargar() {
  const res = await fetch(API + "/api/propiedades-publicas");
  const data = await res.json();
  render(data);
}

function render(data) {
  const g = document.getElementById("grilla");

  g.innerHTML = data.map((p,i)=>{

    const precio = Number(p.precio||0).toLocaleString('es-AR');

    const wa = encodeURIComponent(
`Hola Vanina 👋

Estoy viendo esta propiedad:
${p.titulo}

¿Sigue disponible? Me gustaría más info`
    );

    const img = p.imagenes?.[0] ? API+"/uploads/"+p.imagenes[0] : "";

    return `
    <div class="card">
      ${img ? `<img class="card-img" src="${img}">` : ""}

      <div class="card-body">
        <div class="card-titulo">${p.titulo}</div>
        <div class="card-precio">USD ${precio}</div>

        <div class="card-urgencia">Quedan pocas consultas activas</div>

        <div class="card-acciones">
          <button onclick="abrir('${p.titulo}')">Me interesa</button>
          <a href="https://wa.me/5493585701632?text=${wa}" target="_blank">WhatsApp</a>
        </div>
      </div>
    </div>
    `;
  }).join("");
}

function abrir(t) {
  propiedadActual = t;
  document.getElementById("modal").style.display="flex";
}

function enviarLead() {
  const nombre = document.getElementById("nombre").value;
  const tel = document.getElementById("tel").value;

  if(!nombre || !tel) return alert("Completá los datos");

  fetch(API + "/api/lead", {
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      nombre,
      telefono:tel,
      propiedad:propiedadActual
    })
  }).catch(()=>{});

  const msg = encodeURIComponent(
`Hola Vanina 👋

Me interesa:
${propiedadActual}

Nombre: ${nombre}
Tel: ${tel}`
  );

  window.open("https://wa.me/5493585701632?text="+msg);

  document.getElementById("modal").style.display="none";
}

cargar();
</script>

</body>
</html>
