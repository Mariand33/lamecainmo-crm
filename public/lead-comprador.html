<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Quiero comprar una propiedad - Equipo Buzzacchi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#c9a84c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VB Inmuebles" />
  <link rel="apple-touch-icon" href="/icon-192x192.png" />
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f4f6f9; display:flex; justify-content:center; align-items:flex-start; padding:20px; min-height:100vh; }
    .card { background:white; width:100%; max-width:420px; padding:22px; border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,0.08); }
    .logo { text-align:center; margin-bottom:10px; }
    .logo img { max-width:150px; height:auto; }
    h1 { text-align:center; font-size:20px; margin-bottom:6px; }
    .sub { text-align:center; font-size:13px; color:#666; margin-bottom:18px; }
    label { display:block; font-size:13px; margin-top:10px; margin-bottom:4px; font-weight:bold; }
    input, select, textarea { width:100%; padding:8px 10px; border-radius:8px; border:1px solid #ccc; font-size:13px; box-sizing:border-box; }
    textarea { resize:vertical; min-height:60px; }
    .fila { display:flex; gap:8px; }
    .col { flex:1; }
    button { margin-top:18px; width:100%; padding:10px; border:none; border-radius:999px; background:#4b3ca7; color:white; font-size:15px; font-weight:bold; cursor:pointer; }
    button:hover { opacity:0.95; }
    .legal { margin-top:10px; font-size:11px; color:#777; text-align:center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/logo.png" alt="Vanina Buzzacchi Negocios Inmobiliarios">
    </div>
    <h1>Quiero comprar una propiedad</h1>
    <div class="sub">Dejanos tus datos y te contactamos para ayudarte a encontrar lo que buscás.</div>
    <form action="/compradores/lead-publico" method="POST">
      <label>Nombre y apellido</label>
      <input type="text" name="nombre" required>
      <label>WhatsApp</label>
      <input type="tel" name="telefono" required>
      <label>Email (opcional)</label>
      <input type="email" name="email">
      <div class="fila">
        <div class="col">
          <label>Operación</label>
          <select name="tipoOperacionBuscada">
            <option value="compra">Compra</option>
            <option value="permuta">Compra con permuta</option>
            <option value="inversion">Inversión</option>
          </select>
        </div>
        <div class="col">
          <label>Tipo de propiedad</label>
          <select name="tipoPropiedad">
            <option value="">Indistinto</option>
            <option value="casa">Casa</option>
            <option value="departamento">Departamento</option>
            <option value="duplex">Dúplex</option>
            <option value="terreno">Terreno</option>
            <option value="local">Local comercial</option>
          </select>
        </div>
      </div>
      <label>Zona preferida</label>
      <input type="text" name="zonaPreferida" placeholder="Ej: Banda Norte, Centro...">
      <div class="fila">
        <div class="col">
          <label>Presupuesto máximo</label>
          <input type="number" name="presupuestoMax">
        </div>
        <div class="col">
          <label>Moneda</label>
          <select name="moneda">
            <option value="USD">USD</option>
            <option value="ARS">ARS</option>
          </select>
        </div>
      </div>
      <label>¿En cuánto tiempo querés comprar?</label>
      <select name="horizonteCompra">
        <option value="0-3">0 a 3 meses</option>
        <option value="3-6">3 a 6 meses</option>
        <option value="6-12">6 a 12 meses</option>
        <option value="+12">Más de 12 meses</option>
      </select>
      <label>¿Tenés propiedad para permutar?</label>
      <select name="tienePermuta">
        <option value="no">No</option>
        <option value="si">Sí</option>
        <option value="evaluando">Estoy evaluando</option>
      </select>
      <label>Detalles adicionales (opcional)</label>
      <textarea name="notas" placeholder="Dormitorios, cochera, patio, crédito aprobado, etc."></textarea>
      <input type="hidden" name="origen" value="formulario-publico">
      <input type="hidden" name="canal" value="landing">
      <button type="submit">Quiero que me contacten</button>
      <div class="legal">Tus datos son confidenciales. Solo serán utilizados para asesorarte.</div>
    </form>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    }
  </script>
</body>
</html>
