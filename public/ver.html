<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ficha del inmueble - EQUIPO BUZZACCHI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      padding: 20px;
      margin: 0;
    }

    .ficha {
      background: white;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      border-bottom: 2px solid #eee;
      padding-bottom: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .logo-buzzacchi {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo-buzzacchi img {
      max-height: 60px;
      width: auto;
      display: block;
    }

    .contacto {
      text-align: right;
      font-size: 12px;
      color: #555;
      line-height: 1.4;
    }

    .contacto strong {
      display: block;
      font-size: 13px;
      color: #333;
    }

    .datos-principales {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }

    .bloque {
      flex: 1 1 220px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
    }

    .bloque h3 {
      margin: 0 0 8px;
      font-size: 13px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .bloque p {
      margin: 0;
      font-size: 18px;
      font-weight: bold;
      color: #1f2937;
    }

    .titulo {
      font-size: 28px;
      margin: 0 0 20px;
      color: #0e6b4d;
    }

    .descripcion {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 24px;
      white-space: pre-line;
      line-height: 1.5;
      color: #333;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .galeria img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #f3f4f6;
    }

    .acciones {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #fff;
    }

    .btn-volver { background: #6b7280; }
    .btn-editar { background: #0984e3; }
    .btn-pdf { background: #27ae60; }

    .estado {
      padding: 40px;
      text-align: center;
      color: #666;
      font-size: 18px;
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .ficha { padding: 16px; }
      .titulo { font-size: 24px; }
      .contacto { text-align: left; }
    }
  </style>
</head>
<body>

  <div class="ficha" id="ficha">
    <div class="estado" id="estado">Cargando inmueble...</div>
  </div>

  <script>
    cconst API_URL = "/api/inmueble/";
    
   
      const params = new URLSearchParams(window.location.search);
      return params.get("id");
    }

    function formatoPrecio(inm) {
     
      if (!precio) return "Consultar";
      return `${inm.moneda || "USD"} ${precio.toLocaleString("es-AR")}`;
    }

    function getImageSrc(img) {
      if (!img) return "";
      if (String(img).startsWith("http://") || String(img).startsWith("https://")) {
        return img;
      }
      return "/uploads/" + img;
    }

    async function cargarFicha() {
      const id = getIdFromUrl();
      const ficha = document.getElementById("ficha");
      const estado = document.getElementById("estado");

      if (!id) {
        estado.textContent = "ID no encontrado.";
        return;
      }

      try {
        const res = await fetch(API_URL + id, { cache: "no-store" });
        const data = await res.json();

        if (!res.ok || !data || data.ok === false) {
          estado.textContent = "Propiedad no encontrada.";
          return;
        }

        const imagenes = Array.isArray(data.imagenes) ? data.imagenes : [];
        const galeriaHtml = imagenes.length
          ? imagenes.map(img => `<img src="${getImageSrc(img)}" alt="Imagen propiedad">`).join("")
          : `<div style="color:#666;">Sin imágenes disponibles.</div>`;

        ficha.innerHTML = `
          <div class="header">
            <div class="logo-buzzacchi">
              <img src="/logo.png" alt="Vanina Buzzacchi">
            </div>
            <div class="contacto">
              <strong>EQUIPO BUZZACCHI</strong>
              Negocios Inmobiliarios<br>
              Río Cuarto, Córdoba
            </div>
          </div>

          <div class="acciones">
            <a class="btn btn-volver" href="/dashboard.html">← Volver</a>
            <a class="btn btn-editar" href="/editar.html?id=${data.id}">Editar</a>
            <a class="btn btn-pdf" href="/api/ficha-pdf/${data.id}" target="_blank">Ver PDF</a>
          </div>

          <h1 class="titulo">${data.titulo || "Sin título"}</h1>

          <div class="datos-principales">
            <div class="bloque">
              <h3>Operación</h3>
              <p>${data.tipoOperacion || "-"}</p>
            </div>
            <div class="bloque">
              <h3>Precio</h3>
              <p>${formatoPrecio(data)}</p>
            </div>
            <div class="bloque">
              <h3>Zona</h3>
              <p>${data.zona || "-"}</p>
            </div>
            <div class="bloque">
              <h3>Dirección</h3>
              <p>${data.direccion || "-"}</p>
            </div>
            <div class="bloque">
              <h3>Dormitorios</h3>
              <p>${data.dormitorios || "-"}</p>
            </div>
            <div class="bloque">
              <h3>Baños</h3>
              <p>${data.banos || "-"}</p>
            </div>
            <div class="bloque">
              <h3>Tipo</h3>
              <p>${data.tipoPropiedad || "-"}</p>
            </div>
            <div class="bloque">
              <h3>Estado</h3>
              <p>${data.estadoPublicacion || "-"}</p>
            </div>
          </div>

          <div class="descripcion">${data.descripcion || "Sin descripción disponible."}</div>

          <div class="galeria">
            ${galeriaHtml}
          </div>
        `;
      } catch (err) {
        console.error(err);
        estado.textContent = "Error cargando inmueble.";
      }
    }

    cargarFicha();
  </script>

</body>
</html>
