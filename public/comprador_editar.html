<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Editar comprador - EQUIPO BUZZACCHI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      background: #f4f6f9;
    }

    /* SIDEBAR */
    .sidebar {
      width: 250px;
      background: linear-gradient(180deg, #6a5acd, #4b3ca7);
      color: white;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .sidebar-logo {
      text-align: center;
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .sidebar-logo img {
      width: 130px;
      height: auto;
      display: block;
      margin: 0 auto 6px;
    }

    .logo-frase {
      font-size: 11px;
      line-height: 1.3;
      opacity: 0.95;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      font-size: 14px;
    }

    .sidebar a:hover {
      background: rgba(255,255,255,0.2);
    }

    /* CONTENIDO */
    .content {
      flex: 1;
      padding: 30px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
    }

    label {
      font-size: 13px;
      display: block;
      margin-bottom: 4px;
      margin-top: 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 13px;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .fila {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .col {
      flex: 1;
      min-width: 180px;
    }

    button {
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-primario {
      background: #6c5ce7;
      color: white;
      margin-top: 10px;
    }

    .subtexto {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }

    .pill {
      display: inline-block;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #eafaf1;
      color: #27ae60;
      margin-left: 6px;
    }

    /* 📱 Ajustes para pantallas chicas */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: auto;
      }

      .sidebar {
        width: 100%;
        height: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        padding: 12px 16px;
      }

      .sidebar-logo {
        margin-bottom: 8px;
        border-bottom: none;
      }

      .sidebar-logo img {
        max-width: 100px;
      }

      .sidebar a {
        padding: 6px 10px;
        margin: 4px 4px;
        font-size: 12px;
      }

      .content {
        padding: 16px;
      }

      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <img src="/logo.png" alt="Vanina Buzzacchi Negocios Inmobiliarios">
      <div class="logo-frase">
        Confianza, trayectoria y resultados en Río Cuarto
      </div>
    </div>

    <a href="/dashboard.html">Dashboard</a>
    <a href="/compradores.html">Compradores</a>
    <a href="/filtros.html">Filtros y Búsqueda</a>
    <a href="/logout">Cerrar sesión</a>
  </div>

  <!-- CONTENIDO -->
  <div class="content">
    <h1>Editar comprador</h1>

    <!-- 🧍 Datos básicos -->
    <div class="card">
      <h2>Datos del comprador</h2>
      <form id="formEditar" method="POST">
        <div class="fila">
          <div class="col">
            <label>Nombre</label>
            <input type="text" name="nombre" id="nombre" />
          </div>
          <div class="col">
            <label>Teléfono</label>
            <input type="text" name="telefono" id="telefono" />
          </div>
          <div class="col">
            <label>Email</label>
            <input type="email" name="email" id="email" />
          </div>
        </div>

        <div class="fila">
          <div class="col">
            <label>Operación buscada</label>
            <select name="tipoOperacionBuscada" id="tipoOperacionBuscada">
              <option value="">(cualquiera)</option>
              <option value="compra">Compra</option>
              <option value="alquiler">Alquiler</option>
              <option value="inversion">Inversión</option>
            </select>
          </div>
          <div class="col">
            <label>Tipo de propiedad</label>
            <input type="text" name="tipoPropiedad" id="tipoPropiedad" placeholder="casa, depto, local..." />
          </div>
          <div class="col">
            <label>Zona preferida</label>
            <input type="text" name="zonaPreferida" id="zonaPreferida" />
          </div>
        </div>

        <div class="fila">
          <div class="col">
            <label>Presupuesto máx.</label>
            <input type="number" name="presupuestoMax" id="presupuestoMax" />
          </div>
          <div class="col">
            <label>Moneda</label>
            <select name="moneda" id="moneda">
              <option value="USD">USD</option>
              <option value="ARS">ARS</option>
            </select>
          </div>
          <div class="col">
            <label>Dormitorios mín.</label>
            <input type="number" name="dormitoriosMin" id="dormitoriosMin" />
          </div>
          <div class="col">
            <label>Estado</label>
            <select name="estado" id="estado">
              <option value="frio">Frío</option>
              <option value="tibio">Tibio</option>
              <option value="caliente">Caliente</option>
            </select>
          </div>
        </div>

        <label>Notas</label>
        <textarea name="notas" id="notas" placeholder="Preferencias, comentarios, contexto..."></textarea>

        <!-- 🎮 Bloque MODO JUEGO / INVERSOR -->
        <div class="card" style="margin-top:18px; background:#f8fbff;">
          <h2 style="font-size:16px; margin-top:0;">
            Perfil de juego / inversor
            <span class="pill">Modo sistema</span>
          </h2>

          <div class="fila">
            <div class="col">
              <label>Tipo de jugador</label>
              <select name="tipoJugador" id="tipoJugador">
                <option value="">(sin definir)</option>
                <option value="explorador">Explorador (mira mucho, decide lento)</option>
                <option value="inversor">Inversor (busca números)</option>
                <option value="familiar">Familiar (prioriza hogar)</option>
                <option value="premium">Premium (alto presupuesto)</option>
              </select>
              <div class="subtexto">Te ayuda a recordar cómo piensa este comprador.</div>
            </div>

            <div class="col">
              <label>Score interno</label>
              <input type="number" name="score" id="score" min="0" max="100" />
              <div class="subtexto">0–100 según compromiso, claridad y respuesta.</div>
            </div>

            <div class="col">
              <label>Nivel de confianza</label>
              <select name="nivelConfianza" id="nivelConfianza">
                <option value="">(sin definir)</option>
                <option value="bajo">Bajo</option>
                <option value="medio">Medio</option>
                <option value="alto">Alto</option>
              </select>
            </div>
          </div>

          <div class="fila">
            <div class="col">
              <label>Horizonte de compra</label>
              <select name="horizonteCompra" id="horizonteCompra">
                <option value="">(sin definir)</option>
                <option value="0-3">0 a 3 meses</option>
                <option value="3-6">3 a 6 meses</option>
                <option value="6-12">6 a 12 meses</option>
                <option value="+12">Más de 12 meses</option>
              </select>
            </div>

            <div class="col">
              <label>¿Tiene permuta?</label>
              <select name="tienePermuta" id="tienePermuta">
                <option value="">(no especificado)</option>
                <option value="no">No</option>
                <option value="si">Sí</option>
                <option value="evaluando">Está evaluando</option>
              </select>
            </div>

            <div class="col">
              <label>¿Tiene crédito aprobado?</label>
              <select name="tieneCredito" id="tieneCredito">
                <option value="">(no especificado)</option>
                <option value="no">No</option>
                <option value="si">Sí</option>
                <option value="en_tramite">En trámite</option>
              </select>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-primario">Guardar cambios</button>
      </form>
    </div>
  </div>

  <script>
    function cargarCompradorEditar() {
      const params = new URLSearchParams(window.location.search);
      const idx = Number(params.get("index"));

      if (isNaN(idx)) {
        alert("Índice inválido");
        window.location.href = "/compradores.html";
        return;
      }

      fetch("/api/compradores")
        .then(res => res.json())
        .then(data => {
          const c = data[idx];
          if (!c) {
            alert("Comprador no encontrado");
            window.location.href = "/compradores.html";
            return;
          }

          // Campos básicos
          document.getElementById("nombre").value               = c.nombre || "";
          document.getElementById("telefono").value             = c.telefono || "";
          document.getElementById("email").value                = c.email || "";
          document.getElementById("tipoOperacionBuscada").value = c.tipoOperacionBuscada || "";
          document.getElementById("tipoPropiedad").value        = c.tipoPropiedad || "";
          document.getElementById("zonaPreferida").value        = c.zonaPreferida || "";
          document.getElementById("presupuestoMax").value       = c.presupuestoMax || "";
          document.getElementById("moneda").value               = c.moneda || "USD";
          document.getElementById("dormitoriosMin").value       = c.dormitoriosMin || "";
          document.getElementById("estado").value               = c.estado || "tibio";
          document.getElementById("notas").value                = c.notas || "";

          // Campos de juego / perfil (si no existen aún en JSON, caen en "")
          document.getElementById("tipoJugador").value     = c.tipoJugador || "";
          document.getElementById("score").value           = (typeof c.score === "number" ? c.score : (c.score || ""));
          document.getElementById("nivelConfianza").value  = c.nivelConfianza || "";
          document.getElementById("horizonteCompra").value = c.horizonteCompra || "";
          document.getElementById("tienePermuta").value    = c.tienePermuta || "";
          document.getElementById("tieneCredito").value    = c.tieneCredito || "";

          const form = document.getElementById("formEditar");
          form.action = "/compradores/editar/" + idx;
        })
        .catch(err => {
          console.error("Error cargando comprador:", err);
          alert("Error cargando comprador");
        });
    }

    window.addEventListener("load", cargarCompradorEditar);
  </script>
</body>
</html>
