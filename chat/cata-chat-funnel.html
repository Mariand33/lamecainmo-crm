<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cata | Asistente Inmobiliario</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#0f1a14;
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .box{
      width:92%;
      max-width:520px;
      background:#143d2f;
      padding:24px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.3);
    }

    h1{
      margin:0 0 10px 0;
      font-size:20px;
    }

    .contexto{
      font-size:13px;
      opacity:.8;
      margin-bottom:16px;
    }

    input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      margin-top:10px;
      font-size:14px;
    }

    button{
      width:100%;
      margin-top:12px;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#25D366;
      color:#fff;
      font-weight:bold;
      cursor:pointer;
    }

    .hint{
      font-size:12px;
      opacity:.6;
      margin-top:10px;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>💬 Cata - Asistente Inmobiliario</h1>

  <div class="contexto" id="contexto">
    Cargando propiedad...
  </div>

  <input id="mensaje" placeholder="Contame qué estás buscando..." />

<button onclick="enviar()">Enviar consulta</button>

  <div class="hint">
    Te voy a ayudar a filtrar la mejor propiedad para vos antes de que pierdas tiempo.
  </div>
</div>
<script>

const params = new URLSearchParams(window.location.search);
const property = params.get("property");

const contexto = document.getElementById("contexto");

if(property){
  contexto.innerText = "Analizando propiedad: " + property;
} else {
  contexto.innerText = "Asistente activo para búsqueda inmobiliaria";
}

async function enviar(){

  try {

    const msg = document.getElementById("mensaje").value;

    if(!msg){
      alert("Escribí un mensaje");
      return;
    }

    const response = await fetch("https://inmocreador-crm.onrender.com/api/cata-chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        mensaje: msg,
        propiedad: property
      })
    });

    const data = await response.json();

    alert(data.respuesta || data.error);

  } catch(e){

    console.error(e);

    alert("ERROR: " + e.message);

  }

}

</script>




</body>
</html>
