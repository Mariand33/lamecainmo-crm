<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar Visita · Buzzacchi Inmobiliaria</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold:    #c9a84c;
      --gold-lt: #e8d49a;
      --dark:    #0d0d0d;
      --dark-2:  #141414;
      --dark-3:  #1c1c1c;
      --green:   #25D366;
      --green-d: #1ebe5a;
      --off:     rgba(255,255,255,.78);
      --muted:   rgba(255,255,255,.42);
      --border:  rgba(255,255,255,.09);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Fondo decorativo */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 80% 20%, rgba(201,168,76,.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 60% at 10% 80%, rgba(37,211,102,.04) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--dark-2);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,.55);
      animation: slideUp .5s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes slideUp {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── Foto propiedad ── */
    .prop-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      background: var(--dark-3);
    }

    .prop-img-placeholder {
      width: 100%;
      height: 200px;
      background: var(--dark-3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      opacity: .3;
    }

    /* ── Header ── */
    .header {
      padding: 20px 22px 0;
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(201,168,76,.1);
      border: 1px solid rgba(201,168,76,.22);
      border-radius: 999px;
      padding: 3px 10px;
      margin-bottom: 10px;
    }

    .prop-titulo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.2;
      color: #fff;
      margin-bottom: 5px;
    }

    .prop-subtitulo {
      font-size: 13px;
      color: var(--muted);
    }

    /* ── Visita info ── */
    .visita-box {
      margin: 18px 22px;
      background: var(--dark-3);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .visita-icon {
      width: 48px;
      height: 48px;
      background: rgba(201,168,76,.12);
      border: 1px solid rgba(201,168,76,.22);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .visita-data { flex: 1; }

    .visita-data .label {
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .visita-data .fecha {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 500;
      color: var(--gold-lt);
      line-height: 1.1;
    }

    .visita-data .hora {
      font-size: 13px;
      color: var(--off);
      margin-top: 3px;
    }

    .visita-data .agente {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 22px;
    }

    /* ── Pregunta ── */
    .pregunta {
      padding: 18px 22px 8px;
      text-align: center;
    }

    .pregunta p {
      font-size: 14px;
      color: var(--off);
      line-height: 1.5;
    }

    /* ── Botones ── */
    .btns {
      padding: 14px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .12s, filter .15s;
      text-decoration: none;
    }

    .btn:active { transform: scale(.97); }

    .btn-confirmar {
      background: var(--green);
      color: #0d0d0d;
      font-weight: 700;
    }

    .btn-confirmar:hover { filter: brightness(1.08); }

    .btn-otro {
      background: transparent;
      color: var(--off);
      border: 1px solid var(--border);
    }

    .btn-otro:hover { background: rgba(255,255,255,.04); }

    /* ── Estado confirmado ── */
    .estado-ok {
      display: none;
      padding: 28px 22px;
      text-align: center;
      animation: fadeIn .4s ease both;
    }

    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

    .estado-ok .big-icon {
      font-size: 52px;
      margin-bottom: 14px;
      display: block;
    }

    .estado-ok h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .estado-ok p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: rgba(255,255,255,.22);
      letter-spacing: .05em;
      text-align: center;
      animation: slideUp .5s .15s cubic-bezier(.22,1,.36,1) both;
    }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 40px 22px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="card" id="card">
  <div class="loading">Cargando visita…</div>
</div>

<div class="footer">Vanina Buzzacchi Negocios Inmobiliarios · Río Cuarto</div>

<script>
  const SUPABASE_URL  = "https://nniivhebocgdsynlpuhf.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5uaWl2aGVib2NnZHN5bmxwdWhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMDQ4MDksImV4cCI6MjA5MTg4MDgwOX0.LucbLf6bWhNYdfo2zhmCgkf5gTKsvJWA73_piCmoG70";

  // Número de WhatsApp del equipo (sin + ni espacios)
  const WA_EQUIPO = "5493584000000"; // ← REEMPLAZÁ con el número real

  const params  = new URLSearchParams(window.location.search);
  const propId  = params.get("id");
  const fecha   = params.get("fecha");   // ej: 2026-05-15
  const hora    = params.get("hora");    // ej: 11:00
  const agente  = params.get("agente") || "el equipo";

  const card = document.getElementById("card");

  // ── Formatear fecha legible ───────────────────────────
  function formatearFecha(str) {
    if (!str) return "—";
    const [y, m, d] = str.split("-");
    const dias   = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
    const meses  = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    const date   = new Date(y, m - 1, d);
    return `${dias[date.getDay()]} ${d} de ${meses[m - 1]}`;
  }

  // ── Cargar propiedad y renderizar ────────────────────
  async function init() {
    let prop = null;

    if (propId && /^\d+$/.test(propId)) {
      try {
        const res  = await fetch(`${SUPABASE_URL}/rest/v1/inmuebles?id=eq.${propId}&select=titulo,zona,precio,moneda,imagenes,tipo_operacion&limit=1`, {
          headers: { "apikey": SUPABASE_ANON, "Authorization": "Bearer " + SUPABASE_ANON }
        });
        const data = await res.json();
        if (data && data[0]) prop = data[0];
      } catch(e) {
        console.warn("No se pudo cargar propiedad:", e.message);
      }
    }

    render(prop);
  }

  function render(prop) {
    const titulo    = prop?.titulo    || "Visita coordinada";
    const zona      = prop?.zona      || "";
    const precio    = prop?.precio    ? `${prop.moneda || "USD"} ${Number(prop.precio).toLocaleString("es-AR")}` : "";
    const imgs      = Array.isArray(prop?.imagenes) ? prop.imagenes : [];
    const imgSrc    = imgs[0] || null;
    const fechaStr  = formatearFecha(fecha);

    card.innerHTML = `
      ${imgSrc
        ? `<img class="prop-img" src="${imgSrc}" alt="${titulo}" onerror="this.style.display='none'">`
        : `<div class="prop-img-placeholder">🏡</div>`
      }

      <div class="header">
        <div class="badge">Visita programada</div>
        <div class="prop-titulo">${titulo}</div>
        ${zona || precio ? `<div class="prop-subtitulo">${[zona, precio].filter(Boolean).join(" · ")}</div>` : ""}
      </div>

      <div class="visita-box">
        <div class="visita-icon">📅</div>
        <div class="visita-data">
          <div class="label">Fecha y hora propuesta</div>
          <div class="fecha">${fechaStr}</div>
          <div class="hora">${hora ? "a las " + hora + " hs" : ""}</div>
          ${agente !== "el equipo" ? `<div class="agente">Con ${agente}</div>` : ""}
        </div>
      </div>

      <div class="divider"></div>

      <div class="pregunta">
        <p>¿Podés asistir a esta visita?</p>
      </div>

      <div class="btns">
        <button class="btn btn-confirmar" onclick="confirmar('${titulo}', '${fechaStr}', '${hora}', '${agente}')">
          ✅ Sí, confirmo la visita
        </button>
        <button class="btn btn-otro" onclick="pedirOtro('${titulo}')">
          🔄 Necesito otro horario
        </button>
      </div>
    `;
  }

  // ── Confirmar ─────────────────────────────────────────
  function confirmar(titulo, fechaStr, hora, agente) {
    // Mostrar estado OK
    card.innerHTML = `
      <div class="estado-ok" style="display:block">
        <span class="big-icon">🎉</span>
        <h2>¡Visita confirmada!</h2>
        <p>Perfecto, te esperamos el <strong>${fechaStr}</strong>${hora ? " a las <strong>" + hora + " hs</strong>" : ""}.<br><br>
        Si necesitás cancelar o cambiar el horario, escribinos por WhatsApp.</p>
      </div>
      <div class="btns">
        <a class="btn btn-confirmar" href="${waConfirmar(titulo, fechaStr, hora)}" target="_blank">
          💬 Avisarle al equipo por WhatsApp
        </a>
      </div>
    `;

    // Abrir WhatsApp automáticamente
    setTimeout(() => {
      window.open(waConfirmar(titulo, fechaStr, hora), "_blank");
    }, 800);
  }

  // ── Pedir otro horario ────────────────────────────────
  function pedirOtro(titulo) {
    const texto = `Hola! Quería coordinar una visita para la propiedad *${titulo}*. El horario propuesto no me viene bien, ¿podemos ver otro?`;
    window.open(`https://wa.me/${WA_EQUIPO}?text=${encodeURIComponent(texto)}`, "_blank");
  }

  // ── Armar link WhatsApp confirmación ─────────────────
  function waConfirmar(titulo, fechaStr, hora) {
    const texto = `✅ *Visita confirmada*\n\n📍 Propiedad: ${titulo}\n📅 Fecha: ${fechaStr}${hora ? "\n🕐 Hora: " + hora + " hs" : ""}\n\n¡Nos vemos ahí!`;
    return `https://wa.me/${WA_EQUIPO}?text=${encodeURIComponent(texto)}`;
  }

  init();
</script>

</body>
</html>
